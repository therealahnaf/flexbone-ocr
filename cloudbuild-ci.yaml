steps:
  - id: quality
    name: ghcr.io/astral-sh/uv:0.8.13-python3.11-bookworm-slim
    entrypoint: sh
    args:
      - -ceu
      - |
        uv sync --frozen --dev
        uv run ruff check .
        uv run ruff format --check .
        uv run pytest --cov=app --cov-fail-under=85

options:
  machineType: E2_STANDARD_2
  logging: CLOUD_LOGGING_ONLY

timeout: 900s
