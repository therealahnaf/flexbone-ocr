[project]
name = "flexbone"
version = "0.1.0"
description = "Flexbone FastAPI application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cachetools>=7.1.7",
    "fastapi[standard]>=0.141.1",
    "google-cloud-vision>=3.15.0",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
